<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=ArnisH2.html" />
  <title>TAU Arnis Team</title>
  <style>
    :root {
      --bg: #061b0c;
      --lime: #aaff00;
      --text: #f5f7f4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg), #12632b);
      color: var(--text);
      text-align: center;
      padding: 20px;
    }

    .box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(170, 255, 0, 0.55);
      border-radius: 14px;
      padding: 32px 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
      max-width: 560px;
    }

    h1 {
      color: var(--lime);
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 1px;
    }

    p {
      margin: 0;
      font-size: 1rem;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 18px;
      border-radius: 8px;
      background: var(--lime);
      color: #061b0c;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>TAU ARNIS TEAM</h1>
    <p>Redirecting to the homepage...</p>
    <a href="ArnisH2.html">Open the website</a>
  </div>
</body>
</html>
